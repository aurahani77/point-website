name: Build site

on:
  push:
    branches: [main]
    paths: ['content/**', 'static/**', 'tools/**']
  workflow_dispatch:
  schedule:
    # GitHub delays scheduled runs by hours under load (seen: 6-9h late), so run
    # right after Riyadh midnight and again early morning; the build is idempotent.
    - cron: '17 21 * * *'   # 00:17 Riyadh
    - cron: '37 3 * * *'    # 06:37 Riyadh

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml markdown
      - name: Build and commit (retries if main moved meanwhile)
        run: |
          git config user.name "point-site-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python tools/build.py
            git add -A public preview
            if git diff --cached --quiet; then echo "Built output already up to date"; exit 0; fi
            git commit -q -m "build: update public/ and preview/ [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejected (main moved), retrying..."; sleep 5
          done
          exit 1
      - name: Mirror posts into WordPress admin
        continue-on-error: true
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python tools/wp_sync.py
